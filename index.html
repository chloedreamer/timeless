<script>
  /* Hiệu ứng hoa anh đào */
  const canvas = document.getElementById('sakura-canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const IS_MOBILE = window.innerWidth < 700;
  const PETAL_COUNT = REDUCED_MOTION ? 0 : (IS_MOBILE ? 25 : 40);
  const PETAL_BASE = 40;

  const petalCache = document.createElement('canvas');
  petalCache.width = PETAL_BASE;
  petalCache.height = PETAL_BASE;
  const pctx = petalCache.getContext('2d');
  pctx.font = (PETAL_BASE - 10) + 'px serif';
  pctx.textAlign = 'center';
  pctx.textBaseline = 'middle';
  pctx.fillText('🌸', PETAL_BASE / 2, PETAL_BASE / 2);

  const petals = [];
  for (let i = 0; i < PETAL_COUNT; i++) {
    petals.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight - window.innerHeight,
      size: Math.random() * 10 + 15,
      speedY: Math.random() * 0.6 + 0.6,
      speedX: Math.random() * 0.4 - 0.2,
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.007,
      opacity: Math.random() * 0.20 + 0.25,
      sway: Math.random() * 0.3,
      swayOffset: Math.random() * Math.PI * 2
    });
  }

  let frame = 0;
  let animId = null;
  function animate() {
    if (document.hidden) { animId = null; return; }
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    frame++;
    const h = canvas.height;
    const w = canvas.width;
    for (let i = 0; i < petals.length; i++) {
      const p = petals[i];
      p.y += p.speedY;
      p.x += p.speedX + Math.sin(frame * 0.01 + p.swayOffset) * p.sway;
      p.rotation += p.rotSpeed;
      if (p.y > h + 20) { p.y = -20; p.x = Math.random() * w; }
      const s = p.size / PETAL_BASE;
      const cos = Math.cos(p.rotation) * s;
      const sin = Math.sin(p.rotation) * s;
      ctx.setTransform(cos, sin, -sin, cos, p.x, p.y);
      ctx.globalAlpha = p.opacity;
      ctx.drawImage(petalCache, -PETAL_BASE / 2, -PETAL_BASE / 2);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    animId = requestAnimationFrame(animate);
  }
  if (PETAL_COUNT > 0) animate();
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && animId === null && PETAL_COUNT > 0) animate();
  });
</script>
